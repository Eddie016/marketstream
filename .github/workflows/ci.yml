name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: make install-dev
      - name: Lint, type-check, and test
        run: make check
      - name: Verify generated Protobuf contract
        run: make proto && git diff --exit-code -- proto src/marketstream/proto

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start complete stack
        run: docker compose up --build --wait
      - name: Publish valid, duplicate, and invalid events
        run: docker compose run --rm --no-deps api python /app/scripts/seed-m2-ci.py
      - name: Verify transactional convergence
        run: >-
          docker compose run --rm --no-deps api python /app/scripts/verify-m2.py
          --wait-seconds 60
          --expected-logical-prices 1
          --expected-source-events 3
          --expected-dlq-events 1
      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
