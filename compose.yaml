name: marketstream

services:
  api:
    build:
      context: .
    environment:
      MARKETSTREAM_ENVIRONMENT: ${MARKETSTREAM_ENVIRONMENT:-local}
      MARKETSTREAM_LOG_LEVEL: ${MARKETSTREAM_LOG_LEVEL:-INFO}
      MARKETSTREAM_DATABASE_URL: ${MARKETSTREAM_DATABASE_URL:-postgresql+psycopg://marketstream:marketstream@postgres:5432/marketstream}
      MARKETSTREAM_KAFKA_BOOTSTRAP_SERVERS: ${MARKETSTREAM_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MARKETSTREAM_S3_ENDPOINT_URL: ${MARKETSTREAM_S3_ENDPOINT_URL:-http://minio:9000}
      MARKETSTREAM_S3_ACCESS_KEY: ${MARKETSTREAM_S3_ACCESS_KEY:-marketstream}
      MARKETSTREAM_S3_SECRET_KEY: ${MARKETSTREAM_S3_SECRET_KEY:-marketstream-local-only}
      MARKETSTREAM_S3_BUCKET: ${MARKETSTREAM_S3_BUCKET:-marketstream}
    ports:
      - "${MARKETSTREAM_API_PORT:-8000}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  consumer:
    build:
      context: .
    command: ["marketstream-consume"]
    environment:
      MARKETSTREAM_DATABASE_URL: ${MARKETSTREAM_DATABASE_URL:-postgresql+psycopg://marketstream:marketstream@postgres:5432/marketstream}
      MARKETSTREAM_KAFKA_BOOTSTRAP_SERVERS: ${MARKETSTREAM_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  archiver:
    build:
      context: .
    command: ["marketstream-archive", "--watch"]
    environment:
      MARKETSTREAM_DATABASE_URL: ${MARKETSTREAM_DATABASE_URL:-postgresql+psycopg://marketstream:marketstream@postgres:5432/marketstream}
      MARKETSTREAM_S3_ENDPOINT_URL: ${MARKETSTREAM_S3_ENDPOINT_URL:-http://minio:9000}
      MARKETSTREAM_S3_ACCESS_KEY: ${MARKETSTREAM_S3_ACCESS_KEY:-marketstream}
      MARKETSTREAM_S3_SECRET_KEY: ${MARKETSTREAM_S3_SECRET_KEY:-marketstream-local-only}
      MARKETSTREAM_S3_BUCKET: ${MARKETSTREAM_S3_BUCKET:-marketstream}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  bootstrap:
    build:
      context: .
    command:
      ["sh", "-c", "alembic upgrade head && python -m marketstream.processing.bootstrap"]
    environment:
      MARKETSTREAM_DATABASE_URL: ${MARKETSTREAM_DATABASE_URL:-postgresql+psycopg://marketstream:marketstream@postgres:5432/marketstream}
      MARKETSTREAM_S3_ENDPOINT_URL: ${MARKETSTREAM_S3_ENDPOINT_URL:-http://minio:9000}
      MARKETSTREAM_S3_ACCESS_KEY: ${MARKETSTREAM_S3_ACCESS_KEY:-marketstream}
      MARKETSTREAM_S3_SECRET_KEY: ${MARKETSTREAM_S3_SECRET_KEY:-marketstream-local-only}
      MARKETSTREAM_S3_BUCKET: ${MARKETSTREAM_S3_BUCKET:-marketstream}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  kafka-init:
    image: apache/kafka:4.3.1
    command: ["/bin/sh", "/scripts/init-kafka.sh"]
    volumes:
      - ./scripts/init-kafka.sh:/scripts/init-kafka.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketstream}
      POSTGRES_DB: ${POSTGRES_DB:-marketstream}
    ports:
      - "${MARKETSTREAM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${MARKETSTREAM_KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "${MARKETSTREAM_KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketstream}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-marketstream-local-only}
    ports:
      - "${MARKETSTREAM_MINIO_API_PORT:-9000}:9000"
      - "${MARKETSTREAM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
