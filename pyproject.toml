[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketstream"
version = "0.1.0"
description = "Reproducible personal equity-research data platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Eddie" }]
dependencies = [
  "alembic==1.16.5",
  "boto3==1.40.21",
  "certifi==2026.7.22",
  "fastapi==0.116.1",
  "greenlet==3.5.4",
  "kafka-python==2.3.1",
  "prometheus-client==0.22.1",
  "protobuf==6.31.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyarrow==21.0.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools==1.80.0",
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[project.scripts]
marketstream-archive = "marketstream.processing.archiver:main"
marketstream-consume = "marketstream.processing.consumer:main"
marketstream-data = "marketstream.market_data.download:main"
marketstream-replay = "marketstream.market_data.replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketstream = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=marketstream --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["src/marketstream/proto/*_pb2.*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["marketstream"]
exclude = ["src/marketstream/proto/.*_pb2.py"]

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore",
  "botocore.*",
  "google.protobuf.*",
  "kafka",
  "kafka.*",
  "pyarrow",
  "pyarrow.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
omit = ["src/marketstream/proto/*_pb2.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
